# Usage reporting. When the plugin is enabled, and each time one of its
# commands is used, a small event (plugin name, event name, plugin version)
# is sent to the author's trace server so it is known which plugins are
# actually in use. Nothing about players or the server is included. Sending
# happens off the main thread, never blocks a tick, and is dropped silently
# if the server cannot be reached. Set enabled to false to turn it off.
usage-reporting:
  enabled: true
  endpoint: https://trace.danielstephenson.dev
  # The key identifies this plugin to the trace server, so reports are
  # attributed to DansPluginManager and can be revoked as a group if they are ever
  # abused. It is not a secret -- it ships in this file on every server that
  # runs the plugin -- and it cannot do anything except report as this
  # plugin. Empty means reporting is off regardless of the switch above.
  key: "vbd0rNuUdSZ6QLMdr9axX2I9YPUxUiKya-EkqqVNLpw"
  # Optional static tags attached to every event, e.g. to mark a test server.
  # Leave empty on a normal installation.
  tags: {}
